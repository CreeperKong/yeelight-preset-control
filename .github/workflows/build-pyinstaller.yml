name: Build with PyInstaller

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86
            os: windows-latest
            py_arch: x86
          - target: windows-x64
            os: windows-latest
            py_arch: x64
          - target: windows-arm64
            os: windows-11-arm
            py_arch: arm64
          - target: macos-x64
            os: macos-13
            py_arch: x64
          - target: macos-arm64
            os: macos-14
            py_arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.py_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm --onefile --name yeelight-preset-changer-${{ matrix.target }} yeelight-preset-changer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeelight-preset-changer-${{ matrix.target }}
          path: dist/*

  build-linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
          - ppc64le
          - riscv64
          - s390x
        include:
          - arch: x86_64
            platform: amd64
          - arch: arm64
            platform: arm64
          - arch: ppc64le
            platform: ppc64le
          - arch: riscv64
            platform: riscv64
          - arch: s390x
            platform: s390x

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build executable in Docker
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.13-bookworm \
            bash -lc "apt-get update && apt-get install -y tk && \
            python -m pip install --upgrade pip && \
            pip install -r requirements.txt pyinstaller && \
            pyinstaller --clean --noconfirm --onefile --name yeelight-preset-changer-linux-${{ matrix.arch }} yeelight-preset-changer.py"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeelight-preset-changer-linux-${{ matrix.arch }}
          path: dist/*
